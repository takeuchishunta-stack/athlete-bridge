<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATHLETE BRIDGE｜アスリートのセカンドキャリアを、経営者が語る。</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0b0c'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%23c9a961' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<meta name="description" content="スポーツで培った経験を活かせる企業と出会える。経験者の生の声から、あなたの次のステージを見つけよう。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="site-shell">

  <header class="site-header">
    <a href="#" id="logo-link" class="site-logo">ATHLETE BRIDGE</a>
    <nav class="site-nav">
      <a href="#" id="nav-home">記事一覧</a>
      <a href="#" id="nav-category">カテゴリー</a>
      <a href="#">このメディアについて</a>
      <a href="#">お問い合わせ</a>
    </nav>
  </header>

  <main>
    <!-- Top view: article list -->
    <section id="view-top">
      <div class="hero">
        <div class="hero-eyebrow">ATHLETE BRIDGE</div>
        <h1 class="hero-title">アスリートのセカンドキャリアを、<br>経営者が語る。</h1>
        <div class="hero-divider"></div>
        <p class="hero-desc">スポーツで培った経験を活かせる企業と出会える。経験者の生の声から、あなたの次のステージを見つけよう。</p>
      </div>

      <div id="filter-bar" class="filter-bar"></div>

      <div id="article-grid" class="article-grid"></div>

      <div id="no-results" class="no-results"></div>

      <div class="newsletter-bar">
        <div>
          <div class="newsletter-heading">最新の経営者の言葉を、届けます。</div>
          <form class="newsletter-form" id="newsletter-form">
            <input type="email" id="newsletter-email" class="newsletter-input" placeholder="メールアドレス">
            <button type="submit" id="newsletter-submit" class="newsletter-button">登録する</button>
          </form>
        </div>
        <div class="social-row">
          <div class="social-icon">X</div>
          <div class="social-icon">in</div>
          <div class="social-icon">FB</div>
        </div>
      </div>

      <div class="site-copyright">© 2026 ATHLETE BRIDGE</div>
    </section>

    <!-- Article view: single interview detail -->
    <section id="view-article" class="is-hidden">
      <div class="article-back">
        <a href="#" id="article-back-link">← 記事一覧に戻る</a>
      </div>

      <div id="article-hero-wrap" class="article-hero-wrap"></div>

      <div class="article-content">
        <div id="article-meta" class="article-meta"></div>
        <h1 id="article-title" class="article-title"></h1>
        <div class="article-byline">
          <div id="article-byline"></div>
        </div>

        <div id="article-body" class="article-body"></div>

        <div class="share-row">
          <div class="share-label">この記事をシェア</div>
          <div class="social-icon">X</div>
          <div class="social-icon">FB</div>
          <div class="social-icon is-line">LINE</div>
        </div>
      </div>

      <div class="related-section">
        <div class="related-heading">RELATED INTERVIEW</div>
        <div id="related-grid" class="related-grid"></div>
      </div>

      <div class="site-copyright">© 2026 ATHLETE BRIDGE</div>
    </section>
  </main>

</div>

<script src="js/main.js"></script>
</body>
</html>
